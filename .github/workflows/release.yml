name: Publish tagged release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: make check
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0 && make scan
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: scripts/ci-cores.sh "$RUNNER_TEMP/validators"
      - run: make integration CORE="$RUNNER_TEMP/validators/sing-box" MIHOMO="$RUNNER_TEMP/validators/mihomo" CLOUDFLARED="$RUNNER_TEMP/validators/cloudflared"
      - run: make build && sudo env SINGFORGE_DISPOSABLE_VM=1 sh tests/systemd.sh "$PWD/bin/singforge"
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: make release VERSION="$GITHUB_REF_NAME"
      - run: tar -C dist -czf dist/NOTICES.tar.gz LICENSE licenses
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/singforge-linux-* dist/SHA256SUMS dist/NOTICES.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
